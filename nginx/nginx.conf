# ── Nginx reverse proxy config for Research Copilot (production) ─────────────
#
# Sits in front of both backend (:8000) and frontend (:3000).
# Handles:
#   - Single public entry point on port 80 (add SSL/443 via certbot or a load balancer)
#   - SSE streaming (proxy_buffering off, long timeouts)
#   - Request size limits
#   - Hides internal service ports from the public internet
# ─────────────────────────────────────────────────────────────────────────────

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # Hard request body limit (1 MB) — also enforced in FastAPI middleware
    client_max_body_size 1m;

    # ── Frontend (Next.js) ─────────────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # ── Backend API ────────────────────────────────────────────────────────────
    location /api/ {
        # Strip the /api prefix before forwarding to FastAPI
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 150s;  # longer than PIPELINE_TIMEOUT=120s
        proxy_send_timeout 150s;
    }

    # ── SSE streaming endpoint — disable buffering ─────────────────────────────
    location /api/search/stream {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass             http://backend;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        # Critical for SSE: disable proxy buffering so events reach the client immediately
        proxy_buffering        off;
        proxy_cache            off;
        proxy_set_header       Connection        "";
        proxy_read_timeout     150s;
        proxy_send_timeout     150s;
        # Tell nginx to flush immediately
        add_header             X-Accel-Buffering no;
    }
}
